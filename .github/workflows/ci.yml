name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip ruff pytest 
      - run: ruff check src/ tests/
      - run: pytest tests/ -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path watcher-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path watcher-rs/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path watcher-rs/Cargo.toml
