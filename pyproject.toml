[project]
name = "shesh-files"
version = "0.2.0"
description = "Shesh Soma: real-time, AI-assisted file organizer (watcher + classifier)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
